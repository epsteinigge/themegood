<body class="gallery-page has-site-announcement shared-site">

<main>
<section class="section gallery-hero gallery-hero-minimal">
<h1 class="section-title">ThemeGood Gallery</h1>
</section>

<section class="section">
<div id="galleryGrid" class="gallery-grid" aria-live="polite"></div>

</section>
</main>

<div id="albumDialog" class="album-dialog" role="dialog" aria-modal="true" aria-labelledby="albumTitle" hidden>
  <div class="album-dialog-panel">
    <div class="album-dialog-bar"><span>Event album</span><button id="albumClose" type="button" aria-label="Close album">&times;</button></div>
    <div id="albumView" class="album-dialog-content"></div>
  </div>
</div>

<div class="gallery-lightbox" id="galleryLightbox" role="dialog" aria-modal="true" aria-label="Event photo viewer" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close image">&times;</button>
  <button class="lightbox-arrow left" id="lightboxPrev" aria-label="Previous image">&#10094;</button>
  <div class="lightbox-stage" id="lightboxStage">
    <img id="lightboxImage" alt="Expanded gallery image">
  </div>
  <button class="lightbox-arrow right" id="lightboxNext" aria-label="Next image">&#10095;</button>
  <div class="lightbox-detail"><span id="photoCounter" aria-live="polite"></span><p id="photoCaption"></p></div>
  <div class="lightbox-controls">
    <button id="zoomOut" aria-label="Zoom out">-</button>
    <span id="zoomLevel">100%</span>
    <button id="zoomIn" aria-label="Zoom in">+</button>
  </div>
</div>
